<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link href="./popup.css" rel="stylesheet" />
  </head>

  <body>
    <header>
      <div class="logo-container">
        <img src="../../images/icon128.png" alt="Nitter Redirect logo" />
      </div>
      <small>
        <span>Version:&nbsp;<span id="version"></span></span>
      </small>
    </header>

    <section class="options settings_block">
      <div class="onoffswitch switch" aria-label="Toggle Nitter redirects">
        <h1>Toggle Redirects</h1>
        <input
          aria-hidden="true"
          name="toggleNitter"
          id="toggle-nitter"
          type="checkbox"
          checked
        />&nbsp;
        <label for="toggle-nitter" class="checkbox-label"> </label>
      </div>
    </section>

    <section class="options settings_block">
      <h1>Nitter Instance</h1>
      <div class="clear"></div>

      <select id="instance-mode" aria-label="How to choose a Nitter instance">
        <option value="auto">Automatic &mdash; fastest working instance</option>
        <option value="manual">Pick an instance</option>
        <option value="custom">Custom URL</option>
      </select>

      <div id="auto-panel" class="panel">
        <p id="active-instance" class="active-line"></p>
      </div>

      <div id="manual-panel" class="panel" hidden>
        <select id="instance-select" aria-label="Nitter instance"></select>
      </div>

      <div id="custom-panel" class="panel" hidden>
        <input
          id="instance"
          type="url"
          placeholder="https://nitter.example.com"
          aria-label="Custom Nitter instance URL"
        />
        <p class="hint">Custom instances are not health checked.</p>
      </div>

      <div id="permission-prompt" class="notice" hidden>
        <p>
          Checking which instances are up needs permission to reach the Nitter
          instances this extension knows about. Nothing else is contacted.
        </p>
        <button type="button" id="grant-permission" class="button">
          Allow instance checks
        </button>
      </div>

      <div id="health-section">
        <div class="health-head">
          <h2 id="last-check">Not checked yet</h2>
          <button type="button" id="check-now" class="link-button">
            Check now
          </button>
        </div>
        <ul id="health-list" class="health-list"></ul>
      </div>
    </section>

    <script src="../../browser-api.js"></script>
    <script src="../../instances.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
